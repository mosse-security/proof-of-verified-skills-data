[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-endorsement-scraper"
version = "0.1.0"
description = "Extensible scrapers for collecting assessor endorsements"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "yt-dlp>=2024.12"]

[project.scripts]
scrape-endorsements = "scrapers.cli:main"
scrape-def-con = "scrapers.plugins.def_con:main"
scrape-black-hat = "scrapers.plugins.black_hat:main"
scrape-cansecwest = "scrapers.plugins.cansecwest:main"
scrape-bluehat = "scrapers.plugins.bluehat:main"
merge-individuals = "scrapers.individuals:main"
enrich-endorsements = "scrapers.enrichment_cli:main"
archive-assessor = "scrapers.archive_cli:main"

[tool.setuptools.packages.find]
include = ["scrapers*"]

