[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-endorsement-scraper"
version = "0.1.0"
description = "Extensible scrapers for collecting assessor endorsements"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "yt-dlp>=2024.12"]

[project.scripts]
scrape-endorsements = "endorsement_scraper.cli:main"
scrape-def-con = "scrapers.def_con:main"
scrape-black-hat = "scrapers.black_hat:main"
scrape-cansecwest = "scrapers.cansecwest:main"
merge-individuals = "endorsement_scraper.individuals:main"
enrich-endorsements = "endorsement_scraper.enrichment_cli:main"
archive-assessor = "endorsement_scraper.archive_cli:main"

[tool.setuptools.packages.find]
include = ["endorsement_scraper*", "scrapers*", "enrichers*"]

