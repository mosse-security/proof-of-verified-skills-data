name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package.json
      - name: Install website dependencies
        working-directory: website
        # Resolve platform-specific Astro/Rolldown bindings on Ubuntu instead
        # of reusing the Windows-generated lockfile's optional dependency set.
        run: npm install --include=optional --no-package-lock
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Generate social preview cards
        working-directory: website
        run: npm run build:social
      - name: Check published site size
        working-directory: website
        run: npm run check:pages-size
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
